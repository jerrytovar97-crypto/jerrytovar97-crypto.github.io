<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Paddock Club ES · En breve comenzamos</title>
  <meta name="description" content="Pantalla de bienvenida del stream de Fórmula 1 de Paddock Club ES." />
  <meta name="theme-color" content="#dc2626" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />

  <!-- Tipografía estilo F1: Titillium Web (texto) + Saira Condensed (titulares/números).
       Carga no bloqueante con display=swap; degrada a fuentes de sistema si no carga. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ===== Tema por país (colores de la bandera del GP) =====
       Por defecto = rojo F1. aplicarTema() reescribe estas variables.
       Esta pantalla NO muestra selector: solo aplica el tema recibido por
       ?tema= o localStorage("f1tema"). Cambio sutil (fondo, luces, franja). */
    :root {
      --acento:  #dc2626;
      --acento2: #7f1010;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Titillium Web', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(220, 38, 38, 0.20), transparent 42%),
        radial-gradient(circle at 85% 90%, rgba(220, 38, 38, 0.12), transparent 46%),
        linear-gradient(160deg, #0a0a0a 0%, #141414 100%);
      background-attachment: fixed;
      /* Tamaño ampliado para permitir el desplazamiento del fondo animado. */
      background-size: 200% 200%, 200% 200%, 100% 100%;
    }

    /* Titulares y números en la condensada F1 (Saira Condensed), con fallback. */
    h1, h2, h3, .f1-head {
      font-family: 'Saira Condensed', 'Titillium Web', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    h1, h2 { letter-spacing: -0.01em; }
    /* Dígitos del countdown en la condensada (conservan tabular-nums) */
    #h, #m, #s { font-family: 'Saira Condensed', 'Titillium Web', sans-serif; }

    /* Fondo con degradado animado lento ("respiración"), SOLO fuera de overlay. */
    @keyframes bgBreath {
      0%   { background-position: 0% 0%, 100% 100%, 0 0; }
      100% { background-position: 10% 8%, 90% 92%, 0 0; }
    }
    body:not(.overlay) { animation: bgBreath 30s ease-in-out infinite alternate; }

    /* Glassmorphism (igual que el portal). Borde teñido de acento + glow sutil. */
    .glass-dark {
      position: relative;
      background: rgba(0, 0, 0, 0.40);
      border: 1px solid color-mix(in srgb, var(--acento) 35%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55), 0 0 22px color-mix(in srgb, var(--acento) 24%, transparent);
    }

    /* Textura de fibra de carbono muy tenue como pseudo-elemento. */
    .glass-dark::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 4px);
      opacity: 0.5;
    }
    .glass-dark > * { position: relative; z-index: 1; }

    /* Glow reforzado para la tarjeta central protagonista. */
    .glow-strong {
      box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 34px color-mix(in srgb, var(--acento) 42%, transparent) !important;
      border-color: color-mix(in srgb, var(--acento) 55%, transparent) !important;
    }

    /* Fallback si el navegador embebido (Streamlabs/OBS) no soporta blur */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass-dark { background: rgba(0, 0, 0, 0.88); }
      body.overlay .glass-dark { background: rgba(0, 0, 0, 0.72); }
    }

    /* Fallback de color-mix: restaura el borde blanco 10% y sombras originales. */
    @supports not (background: color-mix(in srgb, red, blue)) {
      .glass-dark {
        border-color: rgba(255, 255, 255, 0.10);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      }
      .glow-strong {
        box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 24px rgba(220,38,38,0.45) !important;
      }
    }

    /* Modo overlay para OBS/Streamlabs (?overlay=1): fondo transparente */
    body.overlay { background: transparent !important; animation: none !important; }
    body.overlay .glass-dark { box-shadow: none; }

    /* Puntito "EN VIVO EN BREVE" pulsante */
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .live-dot { animation: livePulse 1s ease-in-out infinite; }

    /* ===== Cinco luces de salida F1 (secuencia de arranque) ===== */
    .start-light .light {
      width: 26px; height: 26px;
      border-radius: 9999px;
      background: #3a0a0a;                 /* apagada */
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
      display: block;
      transition: background 0.15s, box-shadow 0.15s;
    }
    @media (min-width: 768px) {
      .start-light .light { width: 34px; height: 34px; }
    }
    /* Encendida (se aplica/retira por JS en secuencia; refleja el tema) */
    .start-light.on .light {
      background: radial-gradient(circle at 35% 30%, #ff6b6b, var(--acento) 60%, var(--acento2));
      box-shadow: 0 0 14px rgba(220,38,38,0.9), inset 0 0 4px rgba(255,255,255,0.4);
    }

    /* Franja a cuadros animada (estilo meta) */
    @keyframes slideFlag { from { background-position: 0 0; } to { background-position: 48px 0; } }
    .flag {
      background-image: repeating-linear-gradient(90deg,#fff 0 12px,#000 12px 24px);
      background-size: 24px 12px;
      animation: slideFlag 2s linear infinite;
      /* Borde de acento sutil: refleja el tema por país sin romper los cuadros */
      box-shadow: inset 0 0 0 1px var(--acento);
    }

    /* Pulso del segundero */
    @keyframes tickPulse { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .tick-pulse { animation: tickPulse 0.4s ease-out; }

    /* Barra inferior tipo ticker */
    .ticker-wrap { overflow: hidden; white-space: nowrap; }
    .ticker { display: inline-block; padding-left: 100%; animation: tickerMove 30s linear infinite; }
    @keyframes tickerMove { from { transform: translateX(0); } to { transform: translateX(-100%); } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .live-dot, .flag, .tick-pulse, .ticker { animation: none; }
      body:not(.overlay) { animation: none; }
    }
  </style>
</head>

<body class="min-h-screen text-white flex flex-col">

  <!-- Franja a cuadros superior -->
  <div class="flag h-3 w-full"></div>

  <!-- ===================== CONTENIDO CENTRADO ===================== -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <section class="glass-dark glow-strong rounded-3xl p-8 md:p-14 text-center max-w-3xl w-full">

      <!-- Badge superior -->
      <div class="inline-flex items-center gap-2 bg-red-600 px-4 py-1.5 rounded-full text-xs md:text-sm font-bold uppercase tracking-widest mb-8">
        <span class="live-dot h-2.5 w-2.5 bg-white rounded-full"></span>
        En breve comenzamos
      </div>

      <!-- Marca -->
      <h1 class="text-4xl md:text-6xl font-black tracking-tight uppercase mb-8">
        Paddock Club <span class="text-red-600">ES 🇪🇨</span>
      </h1>

      <!-- Mensaje -->
      <p class="text-red-600 font-bold uppercase tracking-[0.3em] text-xs md:text-sm mb-4">
        El stream inicia en
      </p>

      <!-- Countdown hacia la hora de inicio del stream -->
      <div id="countdown" class="flex justify-center gap-3 sm:gap-5 md:gap-8" role="timer" aria-live="off" aria-label="Cuenta regresiva para el inicio del stream">
        <div class="flex flex-col items-center">
          <span id="h" class="text-5xl sm:text-7xl md:text-8xl font-black text-white tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Horas</span>
        </div>
        <span class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600" style="color:var(--acento)">:</span>
        <div class="flex flex-col items-center">
          <span id="m" class="text-5xl sm:text-7xl md:text-8xl font-black text-white tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Min</span>
        </div>
        <span class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600" style="color:var(--acento)">:</span>
        <div class="flex flex-col items-center">
          <span id="s" class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600 tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Seg</span>
        </div>
      </div>

      <!-- Mensaje cuando ya es la hora -->
      <p id="go" class="hidden mt-8 text-2xl md:text-3xl font-black uppercase tracking-widest text-green-500">
        🏁 ¡Arrancamos!
      </p>

      <!-- Cinco luces de salida F1 (se encienden una a una y luego se apagan) -->
      <div id="lights" class="flex justify-center gap-4 md:gap-6 mt-10" aria-hidden="true">
        <span class="start-light"><span class="light"></span></span>
        <span class="start-light"><span class="light"></span></span>
        <span class="start-light"><span class="light"></span></span>
        <span class="start-light"><span class="light"></span></span>
        <span class="start-light"><span class="light"></span></span>
      </div>

      <!-- Redes sociales -->
      <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-8">
        <!-- TikTok -->
        <a href="https://www.tiktok.com/@paddock.club.es" target="_blank" rel="noopener"
           class="group flex items-center gap-3 text-gray-200 hover:text-white transition-colors">
          <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current" aria-hidden="true">
            <path d="M16.5 3c.3 2.1 1.6 3.7 3.7 3.9v2.4c-1.3.1-2.5-.3-3.7-1v5.9c0 3.4-2.5 5.9-5.8 5.9A5.6 5.6 0 0 1 5 14.5c0-3.2 2.9-5.6 6.1-5.1v2.5c-.4-.1-.9-.2-1.3-.2-1.6 0-2.7 1.3-2.5 2.9.1 1.3 1.3 2.3 2.6 2.3 1.5 0 2.6-1.1 2.6-2.8V3h2z"/>
          </svg>
          <span class="font-bold tracking-wide">@paddock.club.es</span>
        </a>
        <!-- Kick -->
        <a href="https://kick.com/PaddockClubES" target="_blank" rel="noopener"
           class="group flex items-center gap-3 text-gray-200 hover:text-[#53fc18] transition-colors">
          <svg viewBox="0 0 24 24" class="w-7 h-7 fill-current" aria-hidden="true">
            <path d="M3 3h5v5h2V5h2V3h7v7h-2v2h-2v2h2v2h2v7h-7v-2h-2v-3H8v5H3V3z"/>
          </svg>
          <span class="font-bold tracking-wide">PaddockClubES</span>
        </a>
      </div>
    </section>
  </main>

  <!-- Ticker inferior -->
  <div class="ticker-wrap glass-dark border-t border-white/10 py-2">
    <div id="ticker" class="ticker text-sm font-semibold text-gray-200 uppercase tracking-wider"></div>
  </div>

  <!-- Franja a cuadros inferior -->
  <div class="flag h-3 w-full"></div>

  <script>
    /* =========================================================
       CONFIGURACIÓN DE LA PANTALLA DE BIENVENIDA
       ========================================================= */
    // El contador siempre arranca en 15 minutos desde que se abre la página.
    const MINUTOS_INICIO = 15;

    // Mensajes del ticker (edítalos a gusto)
    const MENSAJES_TICKER = [
      "🏎️ Paddock Club ES",
      "📊 Clasificaciones, horarios y grilla en vivo",
      "💬 Saluda en el chat mientras esperamos",
    ];

    /* --------------------------------------------------------- */
    const params = new URLSearchParams(location.search);
    if (params.get("overlay") === "1") document.body.classList.add("overlay");

    /* =========================================================
       TEMA POR PAÍS (colores de la bandera del GP)
       Esta pantalla no muestra selector ni lee hojas: solo aplica el tema
       recibido por ?tema= o localStorage("f1tema"), con respaldo incrustado.
       Helpers idénticos al contrato compartido del portal.
       ========================================================= */
    const TEMA_DEFECTO = { pais: "F1", bandera: "🏁", color1: "#dc2626", color2: "#7f1010" };

    const TEMAS_FALLBACK = [
      { pais: "México",      bandera: "🇲🇽", color1: "#006847", color2: "#ce1126" },
      { pais: "Brasil",      bandera: "🇧🇷", color1: "#009c3b", color2: "#ffdf00" },
      { pais: "España",      bandera: "🇪🇸", color1: "#aa151b", color2: "#f1bf00" },
      { pais: "Italia",      bandera: "🇮🇹", color1: "#008c45", color2: "#cd212a" },
      { pais: "Japón",       bandera: "🇯🇵", color1: "#bc002d", color2: "#ffffff" },
      { pais: "Reino Unido", bandera: "🇬🇧", color1: "#012169", color2: "#c8102e" },
      { pais: "EE.UU.",      bandera: "🇺🇸", color1: "#3c3b6e", color2: "#b22234" },
    ];

    function normalizarPais(txt) {
      return String(txt ?? "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }
    function esHexValido(c) {
      return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(c ?? "").trim());
    }
    function hexAlfa(hex, alfa) {
      let h = String(hex ?? "").trim().replace("#", "");
      if (h.length === 3) h = h.split("").map(c => c + c).join("");
      if (!/^[0-9a-f]{6}$/i.test(h)) h = "dc2626";
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alfa})`;
    }
    function aplicarTema(tema) {
      const t = tema || TEMA_DEFECTO;
      const c1 = esHexValido(t.color1) ? t.color1 : TEMA_DEFECTO.color1;
      const c2 = esHexValido(t.color2) ? t.color2 : TEMA_DEFECTO.color2;
      const raiz = document.documentElement.style;
      raiz.setProperty("--acento", c1);
      raiz.setProperty("--acento2", c2);
      if (!document.body.classList.contains("overlay")) {
        document.body.style.backgroundImage =
          `radial-gradient(circle at 15% 10%, ${hexAlfa(c1, 0.20)}, transparent 42%),` +
          `radial-gradient(circle at 85% 90%, ${hexAlfa(c2, 0.12)}, transparent 46%),` +
          `linear-gradient(160deg, #0a0a0a 0%, #141414 100%)`;
      } else {
        document.body.style.backgroundImage = "";
      }
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", c1);
    }
    function resolverTema(lista) {
      const temas = Array.isArray(lista) && lista.length ? lista : TEMAS_FALLBACK;
      let clave = normalizarPais(params.get("tema") || "");
      if (!clave) {
        try { clave = normalizarPais(localStorage.getItem("f1tema") || ""); }
        catch (e) { clave = ""; }
      }
      if (!clave) return TEMA_DEFECTO;
      return temas.find(t => normalizarPais(t.pais) === clave) || TEMA_DEFECTO;
    }

    // Aplica el tema recibido por URL/localStorage (o rojo F1 por defecto).
    aplicarTema(resolverTema(TEMAS_FALLBACK));

    // El objetivo es siempre 15 minutos a partir de ahora (al cargar la página)
    const objetivo = new Date(Date.now() + MINUTOS_INICIO * 60000);

    // Secuencia de luces de salida F1: se encienden de una en una (cada ~1s)
    // y, al completarse las cinco, se apagan todas de golpe. Luego repite.
    (function () {
      const luces = Array.from(document.querySelectorAll("#lights .start-light"));
      if (!luces.length) return;
      let i = 0;
      function paso() {
        if (i < luces.length) {
          luces[i].classList.add("on");   // enciende la siguiente
          i++;
          setTimeout(paso, 1000);
        } else {
          // Todas encendidas: pausa breve, apaga y reinicia (como la salida)
          setTimeout(() => {
            luces.forEach(l => l.classList.remove("on"));
            i = 0;
            setTimeout(paso, 1200);
          }, 1000);
        }
      }
      paso();
    })();

    // Ticker
    (function () {
      const el = document.getElementById("ticker");
      const texto = MENSAJES_TICKER.join("   •   ");
      el.textContent = texto + "   •   " + texto; // se repite para no dejar hueco
    })();

    // Reloj / cuenta regresiva
    let ultSeg = -1;
    function pad(n) { return String(Math.max(n, 0)).padStart(2, "0"); }

    function tick() {
      const diff = objetivo - new Date();
      const cd = document.getElementById("countdown");
      const go = document.getElementById("go");

      if (isNaN(objetivo.getTime())) {
        // Fecha mal escrita: muestra ceros sin romper
        document.getElementById("h").textContent = "00";
        document.getElementById("m").textContent = "00";
        document.getElementById("s").textContent = "00";
        return;
      }

      if (diff <= 0) {
        cd.classList.add("hidden");
        go.classList.remove("hidden");
        return;
      }

      cd.classList.remove("hidden");
      go.classList.add("hidden");

      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById("h").textContent = pad(h);
      document.getElementById("m").textContent = pad(m);
      document.getElementById("s").textContent = pad(s);

      // Pulso del segundero
      if (s !== ultSeg) {
        ultSeg = s;
        const sEl = document.getElementById("s");
        sEl.classList.remove("tick-pulse");
        void sEl.offsetWidth;
        sEl.classList.add("tick-pulse");
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
