<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Paddock Club ES · Hasta la próxima</title>
  <meta name="description" content="Pantalla de despedida del stream de Fórmula 1 de Paddock Club ES, con cuenta regresiva para el próximo Gran Premio." />
  <meta name="theme-color" content="#dc2626" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse para leer la fecha del próximo GP desde Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(220, 38, 38, 0.20), transparent 42%),
        radial-gradient(circle at 85% 90%, rgba(220, 38, 38, 0.12), transparent 46%),
        linear-gradient(160deg, #0a0a0a 0%, #141414 100%);
      background-attachment: fixed;
    }

    /* Glassmorphism (igual que el portal) */
    .glass-dark {
      background: rgba(0, 0, 0, 0.40);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }
    /* Fallback si el navegador embebido (OBS/Streamlabs) no soporta blur */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass-dark { background: rgba(0, 0, 0, 0.88); }
      body.overlay .glass-dark { background: rgba(0, 0, 0, 0.72); }
    }

    /* Modo overlay para OBS (?overlay=1): fondo transparente */
    body.overlay { background: transparent !important; }
    body.overlay .glass-dark { box-shadow: none; }

    /* Franja a cuadros animada (estilo meta) */
    @keyframes slideFlag { from { background-position: 0 0; } to { background-position: 48px 0; } }
    .flag {
      background-image: repeating-linear-gradient(90deg,#fff 0 12px,#000 12px 24px);
      background-size: 24px 12px;
      animation: slideFlag 2s linear infinite;
    }

    /* Pulso del segundero */
    @keyframes tickPulse { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .tick-pulse { animation: tickPulse 0.4s ease-out; }

    /* ===== Bandera a cuadros ondeando (fin de carrera) ===== */
    .checkered-flag {
      width: 150px; height: 100px;
      border: 3px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      background-image:
        repeating-conic-gradient(#fff 0% 25%, #000 0% 50%);
      background-size: 30px 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      /* El ondeo se logra deformando la bandera con una onda */
      animation: wave 1.6s ease-in-out infinite;
      transform-origin: left center;
    }
    @media (min-width: 768px) {
      .checkered-flag { width: 220px; height: 140px; background-size: 44px 44px; }
    }
    @keyframes wave {
      0%, 100% { transform: perspective(400px) rotateY(0deg) skewY(0deg); }
      25%      { transform: perspective(400px) rotateY(-8deg) skewY(2deg); }
      75%      { transform: perspective(400px) rotateY(8deg) skewY(-2deg); }
    }

    /* Barra inferior tipo ticker */
    .ticker-wrap { overflow: hidden; white-space: nowrap; }
    .ticker { display: inline-block; padding-left: 100%; animation: tickerMove 30s linear infinite; }
    @keyframes tickerMove { from { transform: translateX(0); } to { transform: translateX(-100%); } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .flag, .tick-pulse, .ticker { animation: none; }
    }
  </style>
</head>

<body class="min-h-screen text-white flex flex-col">

  <!-- Franja a cuadros superior -->
  <div class="flag h-3 w-full"></div>

  <!-- ===================== CONTENIDO CENTRADO ===================== -->
  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <section class="glass-dark rounded-3xl p-8 md:p-14 text-center max-w-3xl w-full">

      <!-- Badge superior -->
      <div class="inline-flex items-center gap-2 bg-white/10 border border-white/10 px-4 py-1.5 rounded-full text-xs md:text-sm font-bold uppercase tracking-widest mb-8">
        🏁 Fin de la transmisión
      </div>

      <!-- Mensaje principal -->
      <h1 class="text-4xl md:text-6xl font-black tracking-tight uppercase mb-3">
        ¡Hasta la <span class="text-red-600">próxima!</span>
      </h1>
      <p class="text-gray-400 text-base md:text-lg uppercase tracking-[0.25em] mb-10">
        Gracias por acompañarnos
      </p>

      <!-- Próximo GP -->
      <p class="text-red-600 font-bold uppercase tracking-[0.3em] text-xs md:text-sm mb-2">
        Próximo Gran Premio
      </p>
      <h2 id="gp-title" class="text-2xl md:text-4xl font-black uppercase mb-8">—</h2>

      <!-- Countdown hacia el próximo GP -->
      <div id="countdown" class="flex justify-center gap-3 sm:gap-5 md:gap-8" role="timer" aria-live="off" aria-label="Cuenta regresiva para el próximo Gran Premio">
        <div class="flex flex-col items-center">
          <span id="d" class="text-5xl sm:text-7xl md:text-8xl font-black text-white tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Días</span>
        </div>
        <span class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600">:</span>
        <div class="flex flex-col items-center">
          <span id="h" class="text-5xl sm:text-7xl md:text-8xl font-black text-white tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Horas</span>
        </div>
        <span class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600">:</span>
        <div class="flex flex-col items-center">
          <span id="m" class="text-5xl sm:text-7xl md:text-8xl font-black text-white tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Min</span>
        </div>
        <span class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600">:</span>
        <div class="flex flex-col items-center">
          <span id="s" class="text-5xl sm:text-7xl md:text-8xl font-black text-red-600 tabular-nums">00</span>
          <span class="text-[10px] sm:text-xs md:text-sm uppercase tracking-widest text-gray-400 mt-2">Seg</span>
        </div>
      </div>

      <!-- Mensaje cuando ya llegó el GP -->
      <p id="go" class="hidden mt-8 text-2xl md:text-3xl font-black uppercase tracking-widest text-green-500">
        🏁 ¡Es hoy! Nos vemos en pista
      </p>

      <!-- Bandera a cuadros ondeando (indica fin de la transmisión) -->
      <div class="mt-12 flex justify-center" aria-hidden="true">
        <div class="checkered-flag"></div>
      </div>
    </section>
  </main>

  <!-- Ticker inferior -->
  <div class="ticker-wrap glass-dark border-t border-white/10 py-2">
    <div id="ticker" class="ticker text-sm font-semibold text-gray-200 uppercase tracking-wider"></div>
  </div>

  <!-- Franja a cuadros inferior -->
  <div class="flag h-3 w-full"></div>

  <script>
    /* =========================================================
       CONFIGURACIÓN DE LA PANTALLA DE DESPEDIDA
       ========================================================= */
    // URL CSV de la hoja Horario (misma que usa el portal). De ahí se lee la
    // fila "race" para saber la fecha del próximo GP automáticamente.
    const BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTF1fuQ6Nz-6uIScfyp1sugkd1MQ5TaQZB3IOqKBA6tF7YksRidLrXaP2KwOFD5lxaFIhttQ_yXzFqQ/pub";
    const SCHEDULE_CSV_URL = `${BASE}?gid=1418950549&single=true&output=csv`;

    // Zona horaria de referencia (igual que el portal)
    const ZONA = "America/Guayaquil";

    // Respaldo si la hoja no carga: fecha y nombre del próximo GP
    const GP_FALLBACK = { fecha: new Date("2026-10-25T15:00:00"), pais: "México", bandera: "🇲🇽" };

    const MENSAJES_TICKER = [
      "🏎️ Paddock Club ES",
      "🔔 Vuelve para el próximo Gran Premio",
      "💬 Gracias por ver y comentar",
      "📊 Portal de datos siempre disponible",
    ];

    /* --------------------------------------------------------- */
    const params = new URLSearchParams(location.search);
    if (params.get("overlay") === "1") document.body.classList.add("overlay");

    // Ticker
    (function () {
      const el = document.getElementById("ticker");
      const texto = MENSAJES_TICKER.join("   •   ");
      el.textContent = texto + "   •   " + texto;
    })();

    // Convierte "AAAA-MM-DD HH:MM" (o rango "... - HH:MM") en Date de inicio
    function parseFecha(texto) {
      if (!texto) return null;
      // Si trae rango con " - HH:MM", nos quedamos con la parte de inicio
      const inicio = String(texto).trim().split(/\s+-\s+/)[0];
      const d = new Date(inicio.replace(" ", "T"));
      return isNaN(d.getTime()) ? null : d;
    }

    // Fecha y nombre del próximo GP (se completan al leer la hoja)
    let GP = { ...GP_FALLBACK };

    const fmtDia = new Intl.DateTimeFormat("es-ES", {
      weekday: "long", day: "2-digit", month: "long", timeZone: ZONA
    });
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

    function pintarTitulo() {
      const nombre = `Gran Premio ${GP.pais || ""} ${GP.bandera || ""}`.replace(/\s+/g, " ").trim();
      document.getElementById("gp-title").textContent = nombre || "Próximo Gran Premio";
    }

    // Lee la fila "race" de la hoja Horario para la fecha del próximo GP
    function cargarGP(onReady) {
      if (!SCHEDULE_CSV_URL) { onReady(); return; }
      Papa.parse(SCHEDULE_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: function (r) {
          const filas = r.data || [];
          const race = filas.find(f =>
            (f.clave ?? Object.values(f)[0] ?? "").toString().trim().toLowerCase() === "race"
          );
          if (race) {
            const fecha = parseFecha(race.fecha ?? Object.values(race)[2]);
            if (fecha) {
              GP = {
                fecha,
                pais:    (race.pais ?? "").toString().trim(),
                bandera: (race.bandera ?? "").toString().trim(),
              };
            }
          }
          onReady();
        },
        error: function () { onReady(); } // usa respaldo
      });
    }

    // Cuenta regresiva
    let ultSeg = -1;
    const pad = (n) => String(Math.max(n, 0)).padStart(2, "0");

    function tick() {
      const cd = document.getElementById("countdown");
      const go = document.getElementById("go");
      if (!GP.fecha || isNaN(GP.fecha.getTime())) return;

      const diff = GP.fecha - new Date();
      if (diff <= 0) {
        cd.classList.add("hidden");
        go.classList.remove("hidden");
        return;
      }
      cd.classList.remove("hidden");
      go.classList.add("hidden");

      document.getElementById("d").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("h").textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById("m").textContent = pad(Math.floor((diff % 3600000) / 60000));
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById("s").textContent = pad(s);

      if (s !== ultSeg) {
        ultSeg = s;
        const sEl = document.getElementById("s");
        sEl.classList.remove("tick-pulse");
        void sEl.offsetWidth;
        sEl.classList.add("tick-pulse");
      }
    }

    // Arranque
    cargarGP(function () {
      pintarTitulo();
      tick();
      setInterval(tick, 1000);
    });
    // Relee la hoja cada 5 min por si cambia el calendario
    setInterval(() => cargarGP(pintarTitulo), 300000);
  </script>
</body>
</html>
